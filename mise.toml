[tools]
go = "latest"
node = "latest"
pnpm = "latest"

[tasks."css:build"]
description = "Build CSS with Tailwind"
run = "pnpm exec tailwindcss --input internal/web/src/app.css --output internal/web/static/style.css --minify"

[tasks."css:watch"]
description = "Watch and rebuild CSS on changes"
run = "pnpm exec tailwindcss --input internal/web/src/app.css --output internal/web/static/style.css --watch"

[tasks.build]
description = "Build the Go binary"
depends = ["css:build"]
run = "go build -o cmd/ccexplore/ccexplore ./cmd/ccexplore/"

[tasks.dev]
description = "Run dev server with auto-rebuild"
depends = ["css:build"]
run = "go run ./cmd/ccexplore --open"

[tasks.lint]
description = "Run linter"
run = "pnpm exec oxlint --type-aware --type-check"

[tasks.format]
description = "Format code"
run = "pnpm exec oxfmt --write"

[tasks."format:check"]
description = "Check code formatting"
run = "pnpm exec oxfmt --check"

[tasks."test:unit"]
description = "Run Go unit tests"
run = "go test ./..."

[tasks."test:e2e"]
description = "Run Playwright e2e tests"
depends = ["css:build"]
run = "pnpm exec playwright test --config=playwright-go.config.ts"

[tasks.test]
description = "Run all tests"
depends = ["test:unit", "test:e2e"]
