<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ccpeek mark: a terminal window peeking at rising data -->
  <rect width="64" height="64" rx="14" fill="#11151f"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#303a52" stroke-width="2"/>
  <!-- prompt chevron -->
  <path d="M14 22 L24 32 L14 42" fill="none" stroke="#7aa2f7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- rising bars: the history it peeks at -->
  <rect x="32" y="34" width="6" height="12" rx="2" fill="#3987e5"/>
  <rect x="41" y="27" width="6" height="19" rx="2" fill="#7aa2f7"/>
  <rect x="50" y="19" width="6" height="27" rx="2" fill="#9ece6a"/>
</svg>
