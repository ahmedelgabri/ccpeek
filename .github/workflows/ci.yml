name: CI
env:
  GOTOOLCHAIN: go1.25.8+auto
on:
  push:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: NixOS/nix-installer-action@228d8a956062db04221c97c2794ea443194824aa
      - name: Install npm dependencies
        run: nix develop --command pnpm install
      - name: Check formatting
        run: nix develop --command just format-check
      - name: Go vet
        run: nix develop --command just vet
      - name: Staticcheck
        run: nix develop --command just staticcheck
      - name: Govulncheck
        run: nix develop --command just govulncheck
      - name: Lint JS
        run: nix develop --command just lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: extractions/setup-just@v3
      - run: pnpm install
      - name: Unit tests
        run: just test-unit
      - name: Race tests
        run: just test-race
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: just test-e2e

  build:
    name: Build (Nix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: NixOS/nix-installer-action@228d8a956062db04221c97c2794ea443194824aa
      - name: Check flake
        run: nix flake check
      - name: Build package
        run: nix build
      - name: Test executable runs
        run: ./result/bin/ccpeek --help
