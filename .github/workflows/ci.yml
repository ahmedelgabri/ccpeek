name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Decide trigger
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Skip push runs when the branch already has an open PR
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" != "push" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          open_prs=$(gh pr list \
            --repo "$REPO" \
            --head "$REF_NAME" \
            --state open \
            --json number \
            --jq 'length')

          if [ "$open_prs" -gt 0 ]; then
            echo "Push CI skipped because $OWNER:$REF_NAME already has an open PR."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: NixOS/nix-installer-action@228d8a956062db04221c97c2794ea443194824aa
      - name: Install npm dependencies
        run: nix develop --command pnpm install
      - name: Check formatting
        run: nix develop --command just format-check
      - name: Go vet
        run: nix develop --command just vet
      - name: Staticcheck
        run: nix develop --command just staticcheck
      - name: Govulncheck
        run: nix develop --command just govulncheck
      - name: Check migration fixtures
        run: nix develop --command just check-migration-fixtures
      - name: Lint JS
        run: nix develop --command just lint

  test:
    name: Test
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: extractions/setup-just@v3
      - run: pnpm install
      - name: Unit tests
        run: just test-unit
      - name: Race tests
        run: just test-race
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: just test-e2e

  build:
    name: Build (Nix)
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: NixOS/nix-installer-action@228d8a956062db04221c97c2794ea443194824aa
      - name: Check flake
        run: nix flake check
      - name: Build package
        run: nix build
      - name: Test executable runs
        run: ./result/bin/ccpeek --help
