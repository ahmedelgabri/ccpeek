name: Release
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
permissions:
  contents: write

jobs:
  prepare:
    name: Check Version
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      !contains(github.event.workflow_run.head_commit.message, '[skip release]')
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_exists: ${{ steps.check_tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Get version from flake.nix
        id: version
        run: |
          # Match only the quoted assignment: the ccpeek-ui derivation
          # carries an unquoted `version = self'...` reference above it.
          VERSION=$(grep 'version = "' flake.nix | head -1 | sed 's/.*version = "\([^"]*\)".*/\1/')
          echo "version=$VERSION" >>$GITHUB_OUTPUT
      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: prepare
    if: needs.prepare.outputs.tag_exists == 'false'
    strategy:
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: extractions/setup-just@v3
      - name: Build UI and generate assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          pnpm install
          just ui
          go build -tags withui -ldflags="-s -w -X github.com/ahmedelgabri/ccpeek/internal/cmd.Version=$VERSION" -o ccpeek-native ./cmd/ccpeek/
          mkdir -p dist/completions dist/man
          ./ccpeek-native completion bash > dist/completions/ccpeek.bash
          ./ccpeek-native completion zsh > dist/completions/_ccpeek
          ./ccpeek-native completion fish > dist/completions/ccpeek.fish
          ./ccpeek-native man dist/man
          rm ccpeek-native
      - name: Cross-compile and package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          LDFLAGS="-s -w -X github.com/ahmedelgabri/ccpeek/internal/cmd.Version=$VERSION"
          for arch in amd64 arm64; do
            DIR="ccpeek-${VERSION}-${{ matrix.os }}-${arch}"
            mkdir -p "dist/${DIR}"
            CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${arch} go build -tags withui -ldflags="$LDFLAGS" -o "dist/${DIR}/ccpeek" ./cmd/ccpeek/
            cp -r dist/completions "dist/${DIR}/"
            cp -r dist/man "dist/${DIR}/"
            tar -czf "dist/${DIR}.tar.gz" -C dist "$DIR"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.os }}
          path: dist/ccpeek-*.tar.gz

  release:
    name: Create Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd dist
          sha256sum ccpeek-${VERSION}-*.tar.gz > "ccpeek-${VERSION}-checksums.txt"
      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          CHANGELOG=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --no-merges | head -50)
          echo "changelog<<EOF" >>$GITHUB_OUTPUT
          echo "$CHANGELOG" >>$GITHUB_OUTPUT
          echo "EOF" >>$GITHUB_OUTPUT
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          body: |
            ## Changes

            ${{ steps.changelog.outputs.changelog }}

            ## Installation

            ### Using Nix Flakes

            ```bash
            nix run github:${{ github.repository }}
            ```

            ### Using Homebrew

            ```bash
            brew install ahmedelgabri/tap/ccpeek
            ```

            ### Using mise

            ```bash
            mise use "github:ahmedelgabri/ccpeek"
            ```

            ### Manual Download

            Download the archive for your platform, extract it, and place the binary in your `$PATH`:

            ```bash
            tar xzf ccpeek-${{ needs.prepare.outputs.version }}-<OS>-<ARCH>.tar.gz
            cp ccpeek-${{ needs.prepare.outputs.version }}-<OS>-<ARCH>/ccpeek ~/.local/bin/
            ```

            Completions and man pages are included under `completions/` and `man/`.

            **Checksums:** See `ccpeek-${{ needs.prepare.outputs.version }}-checksums.txt`
          draft: false
          prerelease: false
          files: |
            dist/ccpeek-*.tar.gz
            dist/ccpeek-*-checksums.txt

  update-homebrew:
    name: Update Homebrew Formula
    needs: [prepare, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd dist
          sha256sum ccpeek-${VERSION}-*.tar.gz > "ccpeek-${VERSION}-checksums.txt"
      - uses: actions/checkout@v6
        with:
          repository: ahmedelgabri/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Update formula
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          SHA_DARWIN_ARM64=$(grep "darwin-arm64" dist/ccpeek-${VERSION}-checksums.txt | awk '{print $1}')
          SHA_DARWIN_AMD64=$(grep "darwin-amd64" dist/ccpeek-${VERSION}-checksums.txt | awk '{print $1}')
          SHA_LINUX_ARM64=$(grep "linux-arm64" dist/ccpeek-${VERSION}-checksums.txt | awk '{print $1}')
          SHA_LINUX_AMD64=$(grep "linux-amd64" dist/ccpeek-${VERSION}-checksums.txt | awk '{print $1}')

          cat > homebrew-tap/Formula/ccpeek.rb << EOF
          class Ccpeek < Formula
            desc "Explore your Claude Code history"
            homepage "https://github.com/ahmedelgabri/ccpeek"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/ahmedelgabri/ccpeek/releases/download/v${VERSION}/ccpeek-${VERSION}-darwin-arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/ahmedelgabri/ccpeek/releases/download/v${VERSION}/ccpeek-${VERSION}-darwin-amd64.tar.gz"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/ahmedelgabri/ccpeek/releases/download/v${VERSION}/ccpeek-${VERSION}-linux-arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              end
              on_intel do
                url "https://github.com/ahmedelgabri/ccpeek/releases/download/v${VERSION}/ccpeek-${VERSION}-linux-amd64.tar.gz"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end

            def install
              bin.install "ccpeek"
              bash_completion.install "completions/ccpeek.bash" => "ccpeek"
              zsh_completion.install "completions/_ccpeek"
              fish_completion.install "completions/ccpeek.fish"
              man1.install Dir["man/*.1"]
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/ccpeek --version")
            end
          end
          EOF
      - name: Commit and push
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ccpeek.rb
          git diff --staged --quiet || git commit -m "chore: bump ccpeek to v${VERSION}"
          git push
