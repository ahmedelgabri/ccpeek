name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get version from flake.nix
        id: version
        run: |
          VERSION=$(grep 'version = ' flake.nix | head -1 | sed 's/.*version = "\([^"]*\)".*/\1/')
          echo "version=$VERSION" >>$GITHUB_OUTPUT
      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-go@v5
        if: steps.check_tag.outputs.exists == 'false'
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        if: steps.check_tag.outputs.exists == 'false'
      - uses: actions/setup-node@v4
        if: steps.check_tag.outputs.exists == 'false'
        with:
          node-version: 22
          cache: pnpm
      - name: Build CSS and native binary
        if: steps.check_tag.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pnpm install
          pnpm exec tailwindcss --input internal/web/src/app.css --output internal/web/static/style.css --minify
          go build -ldflags="-s -w -X github.com/ahmedelgabri/ccpeek/internal/cmd.Version=$VERSION" -o ccpeek-native ./cmd/ccpeek/
          mkdir -p dist/completions dist/man
          ./ccpeek-native completion bash > dist/completions/ccpeek.bash
          ./ccpeek-native completion zsh > dist/completions/_ccpeek
          ./ccpeek-native completion fish > dist/completions/ccpeek.fish
          ./ccpeek-native man dist/man
          rm ccpeek-native
      - name: Cross-compile and package
        if: steps.check_tag.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          LDFLAGS="-s -w -X github.com/ahmedelgabri/ccpeek/internal/cmd.Version=$VERSION"
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            OS="${target%/*}"
            ARCH="${target#*/}"
            DIR="ccpeek-${VERSION}-${OS}-${ARCH}"
            mkdir -p "dist/${DIR}"
            GOOS="$OS" GOARCH="$ARCH" go build -ldflags="$LDFLAGS" -o "dist/${DIR}/ccpeek" ./cmd/ccpeek/
            cp -r dist/completions "dist/${DIR}/"
            cp -r dist/man "dist/${DIR}/"
            tar -czf "dist/${DIR}.tar.gz" -C dist "$DIR"
          done
      - name: Generate checksums
        if: steps.check_tag.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          sha256sum ccpeek-${VERSION}-*.tar.gz > "ccpeek-${VERSION}-checksums.txt"
      - uses: actions/upload-artifact@v4
        if: steps.check_tag.outputs.exists == 'false'
        with:
          name: release-assets
          path: |
            dist/ccpeek-*.tar.gz
            dist/ccpeek-*-checksums.txt
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_exists: ${{ steps.check_tag.outputs.exists }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.outputs.tag_exists == 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          CHANGELOG=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --no-merges | head -50)
          echo "changelog<<EOF" >>$GITHUB_OUTPUT
          echo "$CHANGELOG" >>$GITHUB_OUTPUT
          echo "EOF" >>$GITHUB_OUTPUT
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: v${{ needs.build.outputs.version }}
          body: |
            ## Changes

            ${{ steps.changelog.outputs.changelog }}

            ## Installation

            ### Using Nix Flakes

            ```bash
            nix run github:${{ github.repository }}
            ```

            ### Using Homebrew

            ```bash
            brew install ahmedelgabri/ccpeek/ccpeek
            ```

            ### Manual Download

            Download the archive for your platform, extract it, and place the binary in your `$PATH`:

            ```bash
            tar xzf ccpeek-${{ needs.build.outputs.version }}-<OS>-<ARCH>.tar.gz
            cp ccpeek-${{ needs.build.outputs.version }}-<OS>-<ARCH>/ccpeek ~/.local/bin/
            ```

            Completions and man pages are included under `completions/` and `man/`.

            **Checksums:** See `ccpeek-${{ needs.build.outputs.version }}-checksums.txt`
          draft: false
          prerelease: false
          files: |
            dist/ccpeek-*.tar.gz
            dist/ccpeek-*-checksums.txt

  update-homebrew:
    name: Update Homebrew Formula
    needs: [build, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - uses: actions/checkout@v4
        with:
          repository: ahmedelgabri/homebrew-ccpeek
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-ccpeek
      - name: Update formula
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          SHA_DARWIN_ARM64=$(grep "darwin-arm64" dist/ccpeek-${VERSION}-checksums.txt | awk '{print $1}')
          SHA_DARWIN_AMD64=$(grep "darwin-amd64" dist/ccpeek-${VERSION}-checksums.txt | awk '{print $1}')
          SHA_LINUX_ARM64=$(grep "linux-arm64" dist/ccpeek-${VERSION}-checksums.txt | awk '{print $1}')
          SHA_LINUX_AMD64=$(grep "linux-amd64" dist/ccpeek-${VERSION}-checksums.txt | awk '{print $1}')

          cat > homebrew-ccpeek/Formula/ccpeek.rb << EOF
          class Ccpeek < Formula
            desc "Explore your Claude Code history"
            homepage "https://github.com/ahmedelgabri/ccpeek"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/ahmedelgabri/ccpeek/releases/download/v#{version}/ccpeek-#{version}-darwin-arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/ahmedelgabri/ccpeek/releases/download/v#{version}/ccpeek-#{version}-darwin-amd64.tar.gz"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/ahmedelgabri/ccpeek/releases/download/v#{version}/ccpeek-#{version}-linux-arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              end
              on_intel do
                url "https://github.com/ahmedelgabri/ccpeek/releases/download/v#{version}/ccpeek-#{version}-linux-amd64.tar.gz"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end

            def install
              bin.install "ccpeek"
              bash_completion.install "completions/ccpeek.bash" => "ccpeek"
              zsh_completion.install "completions/_ccpeek"
              fish_completion.install "completions/ccpeek.fish"
              man1.install Dir["man/*.1"]
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/ccpeek --version")
            end
          end
          EOF
      - name: Commit and push
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd homebrew-ccpeek
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ccpeek.rb
          git diff --staged --quiet || git commit -m "ccpeek ${VERSION}"
          git push
