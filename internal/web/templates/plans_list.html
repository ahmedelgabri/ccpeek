{{ define "content" }}
  <h1 class="text-2xl font-bold text-slate-50 mb-6">Plans</h1>

  <input
    type="text"
    class="search-input w-full px-4 py-2.5 mb-2 bg-surface-card border border-surface-border rounded-lg text-slate-200 text-sm placeholder:text-slate-600 focus:outline-none focus:border-slate-600 transition-colors"
    placeholder="Filter plans..."
    data-search-target="searchable-list"
  />
  <div class="search-count text-xs text-slate-600 mb-4"></div>

  <div
    class="item-list searchable-list rounded-xl border border-surface-border overflow-hidden divide-y divide-surface-border"
  >
    {{ range .Plans }}
      <a
        href="{{ urlFor "plan" .FileName }}"
        class="list-row group flex items-baseline justify-between gap-4 px-5 py-3 no-underline transition-colors duration-150 hover:bg-surface-hover"
        data-search-keys="{{ .Title }} {{ .FileName }}"
      >
        <span class="text-sm text-slate-200 truncate group-hover:text-slate-50 flex items-center gap-2"
          ><span>{{ .Title }}</span>{{ sourceBadge .Source }}</span
        >
        <span class="text-xs text-slate-500 whitespace-nowrap flex items-center gap-3"
          >{{ if .UpdatedAt }}{{ formatTimestamp .UpdatedAt }}{{ end }} {{ formatBytes .SizeBytes }}</span
        >
      </a>
    {{ else }}
      <div class="px-5 py-8 text-center text-sm text-slate-500">
        No plans found.
      </div>
    {{ end }}
  </div>
{{ end }}

{{ template "layout.html" . }}
