{{define "content"}}
<h1>File History</h1>

<div class="item-list">
  {{range .Entries}}
  <a href="/file-history/{{.ConversationID}}/" class="list-item">
    <span class="item-title mono">{{.ConversationID}}</span>
    <div class="item-meta-group">
      <span class="item-meta">{{.FileCount}} files</span>
      {{if .ProjectName}}<span class="item-meta">{{.ProjectName}}</span>{{end}}
    </div>
  </a>
  {{end}}
</div>
{{end}}

{{template "layout.html" .}}
