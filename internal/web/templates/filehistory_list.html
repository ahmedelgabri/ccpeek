{{ define "content" }}
  <h1 class="text-2xl font-bold text-slate-50 mb-6">File History</h1>

  <div
    class="item-list rounded-xl border border-surface-border overflow-hidden divide-y divide-surface-border"
  >
    {{ range .Entries }}
      <a
        href="{{ urlFor "file-history" .ConversationID }}"
        class="list-row group flex items-baseline justify-between gap-4 px-5 py-3 no-underline transition-colors duration-150 hover:bg-surface-hover"
      >
        <span
          class="text-sm text-slate-200 font-mono truncate group-hover:text-slate-50"
          >{{ .ConversationID }}</span
        >
        <div class="flex items-center gap-4">
          <span class="text-xs text-slate-600">{{ .FileCount }} files</span>
          {{ if .ProjectName }}
            <span class="text-xs text-slate-500"
              >{{ shortenPath .ProjectName }}</span
            >
          {{ end }}
        </div>
      </a>
    {{ else }}
      <div class="px-5 py-8 text-center text-sm text-slate-500">
        No file history found.
      </div>
    {{ end }}
  </div>
{{ end }}
{{ template "layout.html" . }}
