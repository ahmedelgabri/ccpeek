{{ define "content" }}
  <div class="flex items-center gap-4 mb-6">
    <a
      href="/usage-data/"
      class="inline-flex items-center gap-1.5 text-sm text-slate-500 no-underline hover:text-slate-300 transition-colors"
    >
      <svg
        class="w-3.5 h-3.5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"
        />
      </svg>
      Usage Data
    </a>
    <h1 class="text-2xl font-bold text-slate-50">Usage Report</h1>
  </div>

  <div class="bg-white rounded-xl border border-surface-border overflow-hidden">
    <iframe
      src="/usage-data/report/raw"
      sandbox="allow-same-origin"
      class="w-full border-0"
      style="min-height: 80vh"
      title="Claude Code Usage Report"
    ></iframe>
  </div>
{{ end }}
{{ template "layout.html" . }}
