{{ define "content" }}
  <div class="flex items-center gap-4 mb-6">
    {{ backLink "/usage-data/" "Usage Data" }}
    <h1 class="text-2xl font-bold text-slate-50">Usage Report</h1>
  </div>

  <div class="bg-white rounded-xl border border-surface-border overflow-hidden">
    <iframe
      src="/usage-data/report/raw"
      sandbox="allow-same-origin"
      class="w-full border-0"
      style="min-height: 80vh"
      title="Claude Code Usage Report"
    ></iframe>
  </div>
{{ end }}
{{ template "layout.html" . }}
