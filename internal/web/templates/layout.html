{{ define "layout.html" }}
  <!doctype html>
  <html lang="en">
    <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>{{ .Title }} - CCPeek</title>
      <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
      <link rel="stylesheet" href="/static/style.css" />
      <style>{{ chromaCSS }}</style>
    </head>
    <body class="bg-surface text-slate-100 font-sans antialiased">
      <div class="app min-h-screen">
        <button
          id="nav-toggle"
          class="fixed top-3 left-3 z-50 lg:hidden p-2 rounded-lg bg-surface-card border border-surface-border text-slate-400 hover:text-slate-200 transition-colors"
          aria-label="Toggle navigation"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
            />
          </svg>
        </button>
        {{ template "nav.html" . }}
        <main class="flex-1 ml-0 lg:ml-60 p-4 pt-14 lg:p-8 lg:pt-8">
          {{ template "content" . }}
        </main>
      </div>
      <script type="module" src="/static/app.js"></script>
    </body>
  </html>
{{ end }}
