{{ define "content" }}
  {{ template "session_header" . }}


  <div class="space-y-4 my-6">
    {{ range .Blocks }}
      <div
        {{ if .Timestamp }}id="{{ toAnchor "code" .Timestamp }}"{{ end }}
        class="bg-surface-card border border-surface-border rounded-xl overflow-hidden"
      >
        <div
          class="flex items-center justify-between px-4 py-2.5 border-b border-surface-border"
        >
          <div class="flex items-center gap-2 min-w-0">
            <span
              class="text-[10px] font-medium px-2 py-0.5 rounded-full {{ if eq .Tool "Write" }}
                bg-emerald-500/10 text-emerald-400
              {{ else }}
                bg-sky-500/10 text-sky-400
              {{ end }}"
              >{{ .Tool }}</span
            >
            <span class="text-sm text-slate-300 font-mono truncate"
              >{{ .FilePath }}</span
            >
          </div>
          <button
            class="text-xs text-slate-500 hover:text-slate-300 transition-colors"
            data-copy="{{ .Content }}"
          >
            Copy
          </button>
        </div>
        {{ if and (eq .Tool "Edit") .OldString }}
          <div class="px-4 py-2 border-b border-surface-border bg-rose-500/5">
            <div class="text-[10px] text-slate-500 mb-1">old_string</div>
            <pre
              class="text-xs text-rose-400/80 overflow-x-auto m-0"
            ><code>{{ .OldString }}</code></pre>
          </div>
          <div class="px-4 py-2 bg-emerald-500/5">
            <div class="text-[10px] text-slate-500 mb-1">new_string</div>
            <pre
              class="text-xs text-emerald-400/80 overflow-x-auto m-0"
            ><code>{{ .Content }}</code></pre>
          </div>
        {{ else }}
          <pre
            class="text-xs text-slate-300 overflow-x-auto m-0 p-4"
          ><code>{{ .Content }}</code></pre>
        {{ end }}
      </div>
    {{ end }}
  </div>
{{ end }}

{{ template "layout.html" . }}
