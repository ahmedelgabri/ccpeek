{{ define "content" }}
  {{ template "session_header" . }}


  <ul class="space-y-1.5">
    {{ range $i, $item := .Items }}
      <li
        id="item-{{ $i }}"
        class="todo-item flex items-baseline gap-3 px-4 py-3 rounded-lg {{ statusColor $item.Status }}"
      >
        <span
          class="todo-status text-[10px] font-semibold px-2.5 py-0.5 rounded-full whitespace-nowrap uppercase tracking-wide"
          >{{ $item.Status }}</span
        >
        <span class="text-sm text-slate-300">{{ $item.Content }}</span>
        {{ if $item.ActiveForm }}
          <span class="text-xs text-slate-600 italic ml-auto"
            >{{ $item.ActiveForm }}</span
          >
        {{ end }}
      </li>
    {{ end }}
  </ul>
{{ end }}

{{ template "layout.html" . }}
