{{ define "session_tabs" }}
  <div class="flex items-center gap-1 border-b border-surface-border mb-6">
    <a
      href="/projects/{{ .Project.DirName }}/{{ .Session.SessionID }}/"
      class="px-4 py-2.5 text-sm font-medium transition-colors -mb-px {{ if eq .ActiveTab "conversation" }}
        text-slate-100 border-b-2 border-violet-400
      {{ else }}
        text-slate-500 hover:text-slate-300
      {{ end }}"
    >
      Conversation
    </a>
    {{ if .Session.TodoFileName }}
      <a
        href="/projects/{{ .Project.DirName }}/{{ .Session.SessionID }}/todos/"
        class="px-4 py-2.5 text-sm font-medium transition-colors -mb-px {{ if eq .ActiveTab "todos" }}
          text-slate-100 border-b-2 border-violet-400
        {{ else }}
          text-slate-500 hover:text-slate-300
        {{ end }}"
      >
        Todos
      </a>
    {{ end }}
    {{ if .Session.HasFileHistory }}
      <a
        href="/projects/{{ .Project.DirName }}/{{ .Session.SessionID }}/file-history/"
        class="px-4 py-2.5 text-sm font-medium transition-colors -mb-px {{ if eq .ActiveTab "file-history" }}
          text-slate-100 border-b-2 border-violet-400
        {{ else }}
          text-slate-500 hover:text-slate-300
        {{ end }}"
      >
        File History
      </a>
    {{ end }}
    {{ if .Session.BashCommandCount }}
      <a
        href="/projects/{{ .Project.DirName }}/{{ .Session.SessionID }}/commands/"
        class="px-4 py-2.5 text-sm font-medium transition-colors -mb-px {{ if eq .ActiveTab "commands" }}
          text-slate-100 border-b-2 border-violet-400
        {{ else }}
          text-slate-500 hover:text-slate-300
        {{ end }}"
      >
        Commands
      </a>
    {{ end }}
  </div>
{{ end }}
