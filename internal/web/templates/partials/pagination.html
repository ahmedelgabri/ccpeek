{{ define "pagination" }}
  {{ if gt .TotalPages 1 }}
    <div class="flex items-center gap-3 my-4">
      {{ if .HasPrev }}
        <a
          href="?page={{ .PrevPage }}"
          class="px-3 py-1.5 text-sm rounded-lg bg-surface-hover text-slate-400 no-underline hover:bg-surface-border-hover hover:text-slate-200 transition-colors"
          >Prev</a
        >
      {{ else }}
        <span
          class="px-3 py-1.5 text-sm rounded-lg bg-surface-hover text-slate-600 opacity-50"
          >Prev</span
        >
      {{ end }}
      <form
        class="flex items-center gap-1.5"
        data-page-jump
        data-total-pages="{{ .TotalPages }}"
      >
        <span class="text-sm text-slate-500">Page</span>
        <input
          type="number"
          min="1"
          max="{{ .TotalPages }}"
          value="{{ .Page }}"
          class="w-14 px-2 py-1 text-sm text-center bg-surface-card border border-surface-border rounded-md text-slate-200 focus:outline-none focus:border-slate-600 transition-colors [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"
        />
        <span class="text-sm text-slate-500">of {{ .TotalPages }}</span>
      </form>
      <span class="text-xs text-slate-600">({{ .TotalMsgs }} messages)</span>
      {{ if .HasNext }}
        <a
          href="?page={{ .NextPage }}"
          class="px-3 py-1.5 text-sm rounded-lg bg-surface-hover text-slate-400 no-underline hover:bg-surface-border-hover hover:text-slate-200 transition-colors"
          >Next</a
        >
      {{ else }}
        <span
          class="px-3 py-1.5 text-sm rounded-lg bg-surface-hover text-slate-600 opacity-50"
          >Next</span
        >
      {{ end }}
    </div>
  {{ end }}
{{ end }}
