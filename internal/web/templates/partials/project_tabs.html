{{ define "project_tabs" }}
  <div class="flex items-center gap-1 border-b border-surface-border mb-6">
    <a
      href="{{ urlFor "project" .Project.DirName }}"
      class="px-4 py-2.5 text-sm font-medium transition-colors -mb-px {{ if eq .ActiveProjectTab "sessions" }}
        text-slate-100 border-b-2 border-violet-400
      {{ else }}
        text-slate-500 hover:text-slate-300
      {{ end }}"
    >
      Sessions
    </a>
    {{ if .MemoryCount }}
      <a
        href="{{ urlFor "project-tab" .Project.DirName "memories" }}"
        class="px-4 py-2.5 text-sm font-medium transition-colors -mb-px {{ if eq .ActiveProjectTab "memories" }}
          text-slate-100 border-b-2 border-violet-400
        {{ else }}
          text-slate-500 hover:text-slate-300
        {{ end }}"
      >
        Memories
        <span class="text-xs text-slate-600 ml-1">{{ .MemoryCount }}</span>
      </a>
    {{ end }}
  </div>
{{ end }}
