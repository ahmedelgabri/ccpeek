{{ define "content" }}
  <div class="flex items-center gap-4 mb-4">
    <a
      href="/paste-cache/"
      class="inline-flex items-center gap-1.5 text-sm text-slate-500 no-underline hover:text-slate-300 transition-colors"
    >
      <svg
        class="w-3.5 h-3.5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"
        />
      </svg>
      Paste Cache
    </a>
  </div>
  <h1 class="text-2xl font-bold text-slate-50 font-mono mb-2">
    {{ .Entry.FileName | trimSuffix ".txt" }}
  </h1>
  <div class="text-xs text-slate-500 mb-6">
    {{ formatBytes .Entry.SizeBytes }}
  </div>

  <div
    class="bg-surface-card border border-surface-border rounded-xl overflow-hidden prose-code"
  >
    {{ .Content }}
  </div>
{{ end }}
{{ template "layout.html" . }}
