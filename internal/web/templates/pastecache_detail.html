{{ define "content" }}
  <div class="flex items-center gap-4 mb-4">
    {{ backLink "/paste-cache/" "Paste Cache" }}
  </div>
  <h1 class="text-2xl font-bold text-slate-50 font-mono mb-2">
    {{ .Entry.FileName | trimSuffix ".txt" }}
  </h1>
  <div class="text-xs text-slate-500 mb-6">
    {{ formatBytes .Entry.SizeBytes }}
  </div>

  <div
    class="bg-surface-card border border-surface-border rounded-xl overflow-hidden prose-code"
  >
    {{ .Content }}
  </div>
{{ end }}
{{ template "layout.html" . }}
