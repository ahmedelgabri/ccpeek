{{ define "content" }}
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-slate-50">Usage Data</h1>
    <a
      href="/usage-data/report/"
      class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm text-slate-400 no-underline border border-surface-border rounded-lg hover:text-slate-200 hover:border-slate-600 transition-colors"
    >
      <svg
        class="w-3.5 h-3.5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z"
        />
      </svg>
      View Report
    </a>
  </div>

  <input
    type="text"
    class="search-input w-full px-4 py-2.5 mb-2 bg-surface-card border border-surface-border rounded-lg text-slate-200 text-sm placeholder:text-slate-600 focus:outline-none focus:border-slate-600 transition-colors"
    placeholder="Filter usage data..."
    data-search-target="searchable-list"
  />
  <div class="search-count text-xs text-slate-600 mb-4"></div>

  <div
    class="item-list searchable-list rounded-xl border border-surface-border overflow-hidden divide-y divide-surface-border"
  >
    {{ range .Facets }}
      <a
        href="/usage-data/{{ .SessionID }}/"
        class="list-row group flex flex-col gap-1.5 px-5 py-3 no-underline transition-colors duration-150 hover:bg-surface-hover"
        data-search-keys="{{ .BriefSummary }} {{ .UnderlyingGoal }} {{ .SessionID }} {{ .Outcome }}"
      >
        <div class="flex items-baseline gap-3">
          <span class="{{ outcomeColor .Outcome }} text-xs font-medium"
            >{{ humanize .Outcome }}</span
          >
          <span
            class="{{ helpfulnessColor .Helpfulness }} text-[10px] opacity-75"
            >{{ humanize .Helpfulness }}</span
          >
          {{ if .ProjectName }}
            <span class="text-xs text-slate-600 ml-auto"
              >{{ .ProjectName }}</span
            >
          {{ end }}
        </div>
        <span
          class="text-sm text-slate-200 group-hover:text-slate-50 line-clamp-2"
          >{{ .BriefSummary }}</span
        >
      </a>
    {{ else }}
      <div class="px-5 py-8 text-center text-sm text-slate-600">
        No usage data found
      </div>
    {{ end }}
  </div>
{{ end }}

{{ template "layout.html" . }}
