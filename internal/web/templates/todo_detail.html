{{ define "content" }}
  <div class="flex items-center gap-4 mb-4">
    <a
      href="/todos/"
      class="inline-flex items-center gap-1.5 text-sm text-slate-500 no-underline hover:text-slate-300 transition-colors"
    >
      <svg
        class="w-3.5 h-3.5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"
        />
      </svg>
      Todos
    </a>
    {{ if .Todo.ProjectDir }}
      <a
        href="/projects/{{ .Todo.ProjectDir }}/{{ .Todo.SessionID }}/"
        class="inline-flex items-center gap-1.5 text-sm text-slate-500 no-underline hover:text-slate-300 transition-colors"
      >
        <svg
          class="w-3.5 h-3.5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"
          />
        </svg>
        Session
      </a>
    {{ end }}
  </div>
  <h1 class="text-2xl font-bold text-slate-50 font-mono mb-6">
    {{ .Todo.FileName | trimSuffix ".json" }}
  </h1>

  <ul class="space-y-1.5">
    {{ range .Items }}
      <li
        class="todo-item flex items-baseline gap-3 px-4 py-3 rounded-lg {{ statusColor .Status }}"
      >
        <span
          class="todo-status text-[10px] font-semibold px-2.5 py-0.5 rounded-full whitespace-nowrap uppercase tracking-wide"
          >{{ .Status }}</span
        >
        <span class="text-sm text-slate-300">{{ .Content }}</span>
        {{ if .ActiveForm }}
          <span class="text-xs text-slate-600 italic ml-auto"
            >{{ .ActiveForm }}</span
          >
        {{ end }}
      </li>
    {{ end }}
  </ul>
{{ end }}
{{ template "layout.html" . }}
