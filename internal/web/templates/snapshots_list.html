{{ define "content" }}
  <h1 class="text-2xl font-bold text-slate-50 mb-6">Shell Snapshots</h1>

  <div
    class="item-list rounded-xl border border-surface-border overflow-hidden divide-y divide-surface-border"
  >
    {{ range .Snapshots }}
      <a
        href="{{ urlFor "snapshot" .FileName }}"
        class="list-row group flex items-baseline justify-between gap-4 px-5 py-3 no-underline transition-colors duration-150 hover:bg-surface-hover"
      >
        <span
          class="text-sm text-slate-200 font-mono truncate group-hover:text-slate-50"
          >{{ .FileName }}</span
        >
        <div class="flex items-center gap-4">
          <span class="text-xs text-slate-600 whitespace-nowrap"
            >{{ formatTimestamp .Timestamp }}</span
          >
          <span class="text-xs text-slate-600 whitespace-nowrap"
            >{{ formatBytes .SizeBytes }}</span
          >
        </div>
      </a>
    {{ end }}
  </div>
{{ end }}

{{ template "layout.html" . }}
