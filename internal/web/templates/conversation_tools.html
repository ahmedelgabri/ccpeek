{{ define "content" }}
  {{ template "session_header" . }}

  {{ if .ToolTimeline }}
    <div class="mb-6">
      <div
        id="tool-timeline"
        data-timeline="{{ toJSON .ToolTimeline }}"
        class="bg-surface-card border border-surface-border rounded-xl p-4 overflow-x-auto"
      ></div>
    </div>
  {{ end }}


  <div class="flex flex-wrap gap-2 mb-6" id="tool-filters">
    {{ range .Stats }}
      <button
        class="px-3 py-1.5 rounded-lg bg-surface-card border border-surface-border text-sm cursor-pointer transition-colors hover:border-violet-400/50"
        data-tool-filter="{{ .Name }}"
      >
        <span class="text-slate-400">{{ .Name }}</span>
        <span class="text-slate-200 font-medium ml-1">{{ .Count }}</span>
      </button>
    {{ end }}
  </div>

  <div class="space-y-1" id="tool-calls">
    {{ range .Calls }}
      <div
        {{ if .Timestamp }}id="{{ toAnchor "tool" .Timestamp }}"{{ end }}
        class="flex items-baseline gap-3 px-4 py-2.5 rounded-lg bg-surface-card border border-surface-border"
        data-tool-name="{{ .Name }}"
      >
        <span
          class="text-xs font-medium px-2 py-0.5 rounded-full bg-violet-500/10 text-violet-400 whitespace-nowrap"
          >{{ .Name }}</span
        >
        {{ if .Detail }}
          <span class="text-sm text-slate-400 truncate font-mono min-w-0"
            >{{ .Detail }}</span
          >
        {{ end }}
        {{ if .Timestamp }}
          <a
            href="#{{ toAnchor "tool" .Timestamp }}"
            class="text-xs text-slate-600 whitespace-nowrap ml-auto no-underline hover:text-slate-400 transition-colors"
            >{{ formatDate .Timestamp }}</a
          >
        {{ end }}
      </div>
    {{ end }}
  </div>
{{ end }}

{{ template "layout.html" . }}
