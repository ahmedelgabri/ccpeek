{{ define "content" }}
  {{ template "session_header" . }}


  <div class="space-y-3">
    {{ range .Commands }}
      <div
        {{ if .Timestamp }}id="{{ toAnchor "cmd" .Timestamp }}"{{ end }}
        class="rounded-xl border border-surface-border overflow-hidden bg-surface-card"
      >
        <div
          class="flex items-center justify-between px-4 py-2 border-b border-surface-border"
        >
          <a
            href="#{{ toAnchor "cmd" .Timestamp }}"
            class="text-xs text-slate-600 no-underline hover:text-slate-400 transition-colors"
            >{{ formatDate .Timestamp }}</a
          >
          <button
            data-copy="{{ .Command }}"
            class="text-xs text-slate-500 hover:text-slate-300 transition-colors cursor-pointer px-2 py-1 rounded hover:bg-surface-hover"
          >
            Copy
          </button>
        </div>
        <div class="chroma-wrap overflow-x-auto">
          {{ highlightCode .Command "bash" }}
        </div>
      </div>
    {{ end }}
  </div>
{{ end }}

{{ template "layout.html" . }}
