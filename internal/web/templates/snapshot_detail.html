{{ define "content" }}
  <a
    href="/shell-snapshots/"
    class="inline-flex items-center gap-1.5 text-sm text-slate-500 no-underline hover:text-slate-300 mb-4 transition-colors"
  >
    <svg
      class="w-3.5 h-3.5"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"
      />
    </svg>
    Shell Snapshots
  </a>
  <h1 class="text-2xl font-bold text-slate-50 font-mono mb-6">
    {{ .Snapshot.FileName }}
  </h1>
  <div
    class="code-block rounded-xl overflow-hidden border border-surface-border"
  >
    {{ .Content }}
  </div>
{{ end }}
{{ template "layout.html" . }}
